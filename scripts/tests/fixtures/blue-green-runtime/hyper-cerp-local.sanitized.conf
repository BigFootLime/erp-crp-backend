<VirtualHost *:8081>
  ProxyPass /api/ http://127.0.0.1:8080/api/ retry=0
  ProxyPassReverse /api/ http://127.0.0.1:8080/api/
  # GED and test reverse mappings have explicit precedence and are not blue/green targets.
  ProxyPassReverse /api/ http://127.0.0.1:8082/api/
  ProxyPassReverse /api/ http://127.0.0.1:8084/api/
  ProxyPass /socket.io/ ws://127.0.0.1:8080/socket.io/ retry=0
  ProxyPassReverse /socket.io/ ws://127.0.0.1:8080/socket.io/
  ProxyPassReverse /socket.io/ ws://127.0.0.1:8082/socket.io/
  ProxyPassReverse /socket.io/ ws://127.0.0.1:8084/socket.io/
</VirtualHost>
