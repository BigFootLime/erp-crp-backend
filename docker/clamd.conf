LogTime yes
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 7

LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
User clamav

# Bound concurrency and queues for a single CERP instance. The file limits
# cover the 512 MiB GED transport ceiling without silently skipping a blob.
MaxThreads 2
MaxQueue 8
MaxFileSize 550M
MaxScanSize 550M
StreamMaxLength 550M
PCREMaxFileSize 550M
# A parser/decompression ceiling is a rejection, never an implicit clean scan.
# These explicit archive bounds still cover normal Office/CAD containers while
# preventing recursive/container bombs from consuming unbounded work.
HeuristicAlerts yes
AlertExceedsMax yes
MaxRecursion 16
MaxFiles 10000
ReadTimeout 120
CommandReadTimeout 15
SendBufTimeout 500
