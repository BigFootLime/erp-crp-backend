services:
  api-candidate:
    image: ${CERP_CANDIDATE_IMAGE:?set a local fixture image}
    environment:
      CERP_RUNTIME_ROLE: api
    labels:
      traefik.enable: "false"
    ports:
      - "127.0.0.1:15000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5000/health/live >/dev/null"]
    networks: [candidate]
  worker-candidate:
    image: ${CERP_CANDIDATE_IMAGE:?set a local fixture image}
    environment:
      CERP_RUNTIME_ROLE: worker
      CERP_WORKER_HEALTH_PORT: "5001"
    labels:
      traefik.enable: "false"
    ports:
      - "127.0.0.1:15001:5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5001/health/live >/dev/null"]
    networks: [candidate]
networks:
  candidate:
    internal: true
